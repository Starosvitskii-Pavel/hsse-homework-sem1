---
name: datetime
on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"
jobs:
  datetime_ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Print date and time
        run: |
          echo "Current date and time: $(date '+%Y-%m-%d %H:%M:%S')"
  datetime_windows:
    runs-on: windows-latest
    steps:
      - name: Print current date and time (cmd)
        run: |
          echo "Current date and time: 'date /t'" 
      - name: Print current date and time (Powershell)
        shell: pwsh
        run: >
          echo "Current date and time: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
