# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  datetime_ubuntu:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:

      # Runs a single command using the runners shell
      - name: Print date and time
        run: echo "Current date and time: $(date '+%Y-%m-%d %H:%M:%S')"

  datetime_windows:
    runs-on: windows-latest
    steps:
    - name: Print current date and time (cmd)
      run: echo "Current date and time: `date /t`"
    - name: Print current date and time (PowerShell)
      shell: pwsh
      run: echo "Current date and time: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"

